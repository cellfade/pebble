name: macOS build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Validate Xcode project
        run: xcodebuild -list -project Pebble.xcodeproj
      - name: Build app
        run: ./script/build_app.sh debug
      - name: Offline checks
        run: ./script/test_offline.sh
      - name: Beta regression checks
        run: ./script/test_beta.sh
      - name: Archive preview
        run: ./script/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-preview
          path: |
            dist/*.zip
            dist/*.sha256

  store-archive:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Store toolchain
        run: xcodebuild -version
      - name: Archive unsigned Store candidate
        run: ./script/validate_store_archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-store-validation
          path: |
            dist/store-archive-validation.json
            dist/Pebble-Unsigned.xcarchive
